# Save this as .github/workflows/extract-clip.yml in your repo.
#
# Usage:
#   1. Edit clip-config.json (in repo root) with the source URL and timestamps.
#   2. Push that change (or run the workflow manually from the Actions tab
#      and it will read whatever is currently committed in clip-config.json).
#   3. The clip is uploaded to your Backblaze B2 bucket, and a temporary
#      download link (valid 7 days) is printed on the workflow run's
#      Summary page in GitHub — no need to log into Backblaze to get it.
#
# clip-config.json format:
# {
#   "url": "https://example.com/path/to/video.mkv",
#   "start": "00:10:00",
#   "duration": "00:10:00",
#   "output": "clip.mkv"
# }
#
# One-time setup before this workflow will work (no credit card needed):
#   1. Sign up at backblaze.com/sign-up, then open B2 Cloud Storage.
#   2. Buckets -> Create a Bucket -> name it (e.g. "clips") -> set Private.
#   3. App Keys -> Add a New Application Key -> scope it to that bucket only.
#      Copy the keyID and applicationKey shown (applicationKey is shown once).
#   4. On the bucket's page, note its Endpoint, e.g. s3.us-west-002.backblazeb2.com
#   5. In your GitHub repo: Settings -> Secrets and variables -> Actions,
#      add these repository secrets:
#        B2_KEY_ID           = the keyID from step 3
#        B2_APPLICATION_KEY  = the applicationKey from step 3
#        B2_ENDPOINT         = the endpoint from step 4 (no "https://")
#        B2_BUCKET           = the bucket name, e.g. "clips"

name: Extract Clip from MKV

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'clip-config.json'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read config
        id: cfg
        run: |
          echo "url=$(jq -r .url clip-config.json)" >> "$GITHUB_OUTPUT"
          echo "start=$(jq -r .start clip-config.json)" >> "$GITHUB_OUTPUT"
          echo "duration=$(jq -r .duration clip-config.json)" >> "$GITHUB_OUTPUT"
          echo "output=$(jq -r .output clip-config.json)" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Extract clip with ffmpeg
        run: |
          ffmpeg -ss "${{ steps.cfg.outputs.start }}" \
                 -i "${{ steps.cfg.outputs.url }}" \
                 -t "${{ steps.cfg.outputs.duration }}" \
                 -map 0 -c copy -avoid_negative_ts make_zero \
                 "${{ steps.cfg.outputs.output }}"

      - name: Upload clip to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          # This must match the region code in your bucket's endpoint
          # (e.g. endpoint "s3.us-east-005.backblazeb2.com" -> region "us-east-005").
          AWS_DEFAULT_REGION: us-east-005
        run: |
          aws s3 cp "${{ steps.cfg.outputs.output }}" \
            "s3://${{ secrets.B2_BUCKET }}/${{ steps.cfg.outputs.output }}" \
            --endpoint-url "https://${{ secrets.B2_ENDPOINT }}"

      - name: Generate download link
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: us-east-005
        run: |
          URL=$(aws s3 presign "s3://${{ secrets.B2_BUCKET }}/${{ steps.cfg.outputs.output }}" \
            --endpoint-url "https://${{ secrets.B2_ENDPOINT }}" \
            --expires-in 604800)
          if [ -z "$URL" ]; then
            echo "ERROR: presign returned an empty URL. Check bucket name, endpoint, and key permissions."
            exit 1
          fi
          echo "Generated URL: $URL"
          echo "### Clip ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download ${{ steps.cfg.outputs.output }}]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Link expires in 7 days._" >> "$GITHUB_STEP_SUMMARY"
